<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi corporel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://www.gstatic.com/charts/loader.js"></script>
<style>
  :root {
    --fond: #0f1117;
    --carte: #181b26;
    --carte-claire: #1f2330;
    --bordure: #2a2f3d;
    --texte: #e6e8ef;
    --texte-doux: #9aa0b4;
    --accent: #6c8cff;
    --accent-fort: #4a6cf7;
    --hausse: #ff6b6b;
    --baisse: #4ade80;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--fond); }
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; color: var(--texte); }

  header { background: var(--carte); color: var(--texte); padding: 14px 16px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bordure); }
  header button { background: var(--carte-claire); color: var(--texte); border: 1px solid var(--bordure); padding: 6px 12px; border-radius: 8px; cursor: pointer; }

  nav { display: flex; background: var(--carte); border-bottom: 1px solid var(--bordure); }
  nav button { flex: 1; padding: 12px; border: none; background: none; color: var(--texte-doux); font-size: 15px; cursor: pointer; }
  nav button.actif { color: var(--accent); border-bottom: 3px solid var(--accent); font-weight: bold; }

  main { padding: 16px; max-width: 720px; margin: auto; }

  .carte { background: var(--carte); border: 1px solid var(--bordure); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .carte h3 { margin: 0 0 12px 0; font-size: 16px; color: var(--texte); }

  label { display: block; margin-top: 12px; font-size: 13px; color: var(--texte-doux); }
  input, select { width: 100%; padding: 11px; margin-top: 6px; font-size: 16px; border: 1px solid var(--bordure); border-radius: 8px; background: var(--fond); color: var(--texte); color-scheme: dark; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }

  button.principal { width: 100%; margin-top: 16px; padding: 13px; font-size: 16px; background: var(--accent-fort); color: white; border: none; border-radius: 8px; cursor: pointer; }
  button.principal:hover { background: var(--accent); }

  .message { margin-top: 10px; font-size: 14px; color: var(--texte-doux); }

  /* Carte "pesée du jour" */
  .jour { text-align: center; padding: 22px 18px; background: linear-gradient(135deg, #1e2a52 0%, #181b26 70%); border-color: #2f3a6b; }
  .jour .titre { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--texte-doux); }
  .jour .date { font-size: 15px; color: var(--accent); margin-top: 4px; }
  .jour .poids { font-size: 48px; font-weight: bold; margin: 10px 0 4px 0; color: var(--texte); }
  .jour .poids span { font-size: 20px; color: var(--texte-doux); font-weight: normal; }
  .jour .note { font-size: 14px; color: var(--texte-doux); font-style: italic; }
  .jour .vide { font-size: 15px; color: var(--texte-doux); padding: 10px 0; }

  .defile { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 8px; border-bottom: 1px solid var(--bordure); text-align: left; vertical-align: top; }
  th { color: var(--texte-doux); font-weight: normal; font-size: 13px; }
  .tableau-mesures th, .tableau-mesures td { font-size: 13px; padding: 7px 6px; white-space: nowrap; }

  .hausse { color: var(--hausse); font-weight: bold; }
  .baisse { color: var(--baisse); font-weight: bold; }
  .stable { color: var(--texte-doux); }
  .note { font-size: 12px; color: var(--texte-doux); font-style: italic; }

  .grille-mesures { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ligne-deux { display: flex; gap: 10px; }
  .ligne-deux > * { flex: 1; }

  .supprimer { font-size: 14px; line-height: 1; padding: 2px 6px; background: none; color: #5d6378; border: none; border-radius: 4px; cursor: pointer; }
  .supprimer:hover { color: var(--hausse); }

  .onglet { display: none; }
  .onglet.visible { display: block; }
  #graph { width: 100%; height: 320px; }

  #connexion .carte { border-radius: 16px; }
</style>
</head>
<body>

<div id="connexion" class="carte" style="max-width:420px;margin:40px auto;display:none">
  <h3>Connexion</h3>
  <form id="formConnexion">
    <label>E-mail <input type="email" id="email" required></label>
    <label>Mot de passe <input type="password" id="motdepasse" required></label>
    <button type="submit" class="principal">Se connecter</button>
    <div id="messageConnexion" class="message"></div>
  </form>
</div>

<div id="appli" style="display:none">
  <header>
    Suivi corporel
    <button id="deconnexion">Quitter</button>
  </header>
  <nav>
    <button class="actif" data-onglet="saisie">Accueil</button>
    <button data-onglet="graphique">Graphique</button>
    <button data-onglet="historique">Historique</button>
  </nav>

  <main>
    <!-- Onglet 1 : Accueil -->
    <section id="saisie" class="onglet visible">

      <!-- 1. Pesée du jour -->
      <div class="carte jour">
        <div class="titre">Pesée du jour</div>
        <div id="aujourdhui"></div>
      </div>

      <!-- Formulaire de pesée -->
      <div class="carte">
        <h3>Enregistrer une pesée</h3>
        <form id="formPesee">
          <label>Date <input type="date" id="datePesee" required></label>
          <label>Poids (kg) <input type="number" id="poids" step="0.1" inputmode="decimal" required></label>
          <label>Note (facultatif) <input type="text" id="note" placeholder="ex : restaurant hier soir"></label>
          <button type="submit" class="principal">Enregistrer la pesée</button>
          <div id="messagePesee" class="message"></div>
        </form>
      </div>

      <!-- 2. Mesures corporelles -->
      <div class="carte">
        <h3>Mesures corporelles</h3>
        <form id="formMensure">
          <label>Date <input type="date" id="dateMensure" required></label>
          <div class="grille-mesures">
            <label>Tour de bras (cm) <input type="number" id="m_bras" step="0.1" inputmode="decimal"></label>
            <label>Tour de cuisse (cm) <input type="number" id="m_cuisse" step="0.1" inputmode="decimal"></label>
            <label>Tour de hanche (cm) <input type="number" id="m_hanche" step="0.1" inputmode="decimal"></label>
            <label>Tour de taille (cm) <input type="number" id="m_taille" step="0.1" inputmode="decimal"></label>
            <label>Tour de poitrine (cm) <input type="number" id="m_poitrine" step="0.1" inputmode="decimal"></label>
            <label>Tour d'épaules (cm) <input type="number" id="m_epaules" step="0.1" inputmode="decimal"></label>
          </div>
          <button type="submit" class="principal">Enregistrer les mesures</button>
          <div id="messageMensure" class="message"></div>
        </form>
      </div>

      <!-- 3. Dernières pesées -->
      <div class="carte">
        <h3>Dernières pesées</h3>
        <div id="dernieres" class="defile">Chargement…</div>
      </div>
    </section>

    <!-- Onglet 2 : Graphique -->
    <section id="graphique" class="onglet">
      <div class="carte">
        <div class="ligne-deux">
          <label>Type
            <select id="type">
              <option value="poids">Poids quotidien</option>
              <option value="semaine">Moyenne par semaine</option>
            </select>
          </label>
          <label>Période
            <select id="periode">
              <option value="5j">5 derniers jours</option>
              <option value="1m">1 mois</option>
              <option value="6m">6 mois</option>
              <option value="1a">1 an</option>
              <option value="tout" selected>Tout</option>
            </select>
          </label>
        </div>
        <div id="graph"></div>
        <div id="resume" class="message"></div>
      </div>
    </section>

    <!-- Onglet 3 : Historique -->
    <section id="historique" class="onglet">
      <div class="carte">
        <h3>Historique des pesées</h3>
        <div id="tableauComplet" class="defile">Chargement…</div>
      </div>
      <div class="carte">
        <h3>Historique des mesures corporelles</h3>
        <div id="tableauMensures" class="defile">Chargement…</div>
      </div>
    </section>
  </main>
</div>

<script>
  const SUPABASE_URL = 'https://ylzizhjrqcwtjgqoiqhe.supabase.co';
  const SUPABASE_CLE = 'sb_publishable_7gctFj_zdHJ_vieQYEAeqg_7_ioeNls';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_CLE);

  const TABLE_MESURES = 'mesures_corporelles';
  const MESURES = ['bras', 'cuisse', 'hanche', 'taille', 'poitrine', 'epaules'];
  const NOMS_MESURES = { bras: 'Bras', cuisse: 'Cuisse', hanche: 'Hanche', taille: 'Taille', poitrine: 'Poitrine', epaules: 'Épaules' };

  let userId = null;
  let pesees = [];
  let mesures = [];
  let googleChargé = false;
  let ongletActif = 'saisie';

  google.charts.load('current', { packages: ['corechart'] });
  google.charts.setOnLoadCallback(() => {
    googleChargé = true;
    if (ongletActif === 'graphique') dessiner();
  });

  // ---------- Utilitaires ----------
  function fr(n) {
    return Number(n).toFixed(1).replace('.', ',');
  }

  function formaterDate(s) {
    const [y, m, d] = s.split('-');
    return d + '/' + m + '/' + y;
  }

  function dateLocale(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function versIso(d) {
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const j = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + j;
  }

  function lundiDe(d) {
    const x = new Date(d);
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function badgeVariation(liste, i) {
    if (i >= liste.length - 1) return '';
    const diff = liste[i].poids - liste[i + 1].poids;
    const cls = diff > 0.05 ? 'hausse' : diff < -0.05 ? 'baisse' : 'stable';
    const signe = diff > 0 ? '+' : '';
    return '<span class="' + cls + '">' + signe + fr(diff) + ' kg</span>';
  }

  function tableauPesees(liste) {
    let html = '<table><tr><th>Date</th><th>Poids</th><th>Variation</th><th></th></tr>';
    liste.forEach((p, i) => {
      html += '<tr>'
        + '<td>' + formaterDate(p.date) + '</td>'
        + '<td>' + fr(p.poids) + ' kg' + (p.note ? '<div class="note">' + escapeHtml(p.note) + '</div>' : '') + '</td>'
        + '<td>' + badgeVariation(liste, i) + '</td>'
        + '<td><button class="supprimer" title="Supprimer" onclick="supprimerPesee(' + p.id + ')">&times;</button></td>'
        + '</tr>';
    });
    return html + '</table>';
  }

  function tableauMesures(liste) {
    let html = '<table class="tableau-mesures"><tr><th>Date</th>';
    MESURES.forEach(c => { html += '<th>' + NOMS_MESURES[c] + '</th>'; });
    html += '<th></th></tr>';
    liste.forEach(m => {
      html += '<tr><td>' + formaterDate(m.date) + '</td>';
      MESURES.forEach(c => {
        html += '<td>' + (m[c] !== null ? fr(m[c]) : '—') + '</td>';
      });
      html += '<td><button class="supprimer" title="Supprimer" onclick="supprimerMesure(' + m.id + ')">&times;</button></td></tr>';
    });
    return html + '</table>';
  }

  // Texte affiché au survol d'un point du graphique
  function infoBulle(p) {
    let t = formaterDate(p.date) + '\nPoids : ' + fr(p.poids) + ' kg';
    if (p.note) t += '\nNote : ' + p.note;
    return t;
  }

  // ---------- Pesée du jour (accueil) ----------
  function afficherAujourdhui() {
    const aujourdhui = versIso(new Date());
    const zone = document.getElementById('aujourdhui');
    const pesee = pesees.find(p => p.date === aujourdhui);

    if (pesee) {
      zone.innerHTML =
        '<div class="date">' + formaterDate(aujourdhui) + '</div>'
        + '<div class="poids">' + fr(pesee.poids) + '<span> kg</span></div>'
        + (pesee.note ? '<div class="note">' + escapeHtml(pesee.note) + '</div>' : '');
    } else {
      zone.innerHTML =
        '<div class="date">' + formaterDate(aujourdhui) + '</div>'
        + '<div class="vide">Pas encore de pesée aujourd\'hui</div>';
    }
  }

  // ---------- Connexion ----------
  async function demarrer() {
    const { data } = await sb.auth.getSession();
    if (data.session) {
      userId = data.session.user.id;
      montrerAppli();
    } else {
      document.getElementById('connexion').style.display = 'block';
    }
  }

  document.getElementById('formConnexion').addEventListener('submit', async e => {
    e.preventDefault();
    const { data, error } = await sb.auth.signInWithPassword({
      email: document.getElementById('email').value,
      password: document.getElementById('motdepasse').value
    });
    if (error) {
      document.getElementById('messageConnexion').textContent = 'Erreur : ' + error.message;
    } else {
      userId = data.user.id;
      montrerAppli();
    }
  });

  document.getElementById('deconnexion').addEventListener('click', async () => {
    await sb.auth.signOut();
    location.reload();
  });

  function montrerAppli() {
    document.getElementById('connexion').style.display = 'none';
    document.getElementById('appli').style.display = 'block';
    const aujourdhui = versIso(new Date());
    document.getElementById('datePesee').value = aujourdhui;
    document.getElementById('dateMensure').value = aujourdhui;
    charger();
  }

  // ---------- Navigation ----------
  document.querySelectorAll('nav button').forEach(bouton => {
    bouton.addEventListener('click', () => {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('actif'));
      document.querySelectorAll('.onglet').forEach(s => s.classList.remove('visible'));
      bouton.classList.add('actif');
      document.getElementById(bouton.dataset.onglet).classList.add('visible');
      ongletActif = bouton.dataset.onglet;
      if (ongletActif === 'graphique') dessiner();
    });
  });

  // ---------- Données ----------
  // Chaque table est chargée séparément : une erreur sur les mesures n'empêche pas d'afficher les pesées.
  async function charger() {
    const resPesees = await sb.from('pesees').select('*').order('date', { ascending: false });
    if (resPesees.error) {
      document.getElementById('dernieres').textContent = 'Erreur pesées : ' + resPesees.error.message;
      document.getElementById('tableauComplet').textContent = 'Erreur pesées : ' + resPesees.error.message;
    } else {
      pesees = resPesees.data;
      afficherAujourdhui();
      afficherDernieres();
      afficherHistoriquePesees();
    }

    const resMesures = await sb.from(TABLE_MESURES).select('*').order('date', { ascending: false });
    if (resMesures.error) {
      document.getElementById('tableauMensures').textContent = 'Erreur mesures : ' + resMesures.error.message;
    } else {
      mesures = resMesures.data;
      afficherHistoriqueMesures();
    }

    if (ongletActif === 'graphique') dessiner();
  }

  function afficherDernieres() {
    if (!pesees.length) {
      document.getElementById('dernieres').textContent = 'Aucune pesée pour le moment.';
      return;
    }
    document.getElementById('dernieres').innerHTML = tableauPesees(pesees.slice(0, 5));
  }

  function afficherHistoriquePesees() {
    if (!pesees.length) {
      document.getElementById('tableauComplet').textContent = 'Aucune pesée pour le moment.';
      return;
    }
    document.getElementById('tableauComplet').innerHTML = tableauPesees(pesees);
  }

  function afficherHistoriqueMesures() {
    if (!mesures.length) {
      document.getElementById('tableauMensures').textContent = 'Aucune mesure pour le moment.';
      return;
    }
    document.getElementById('tableauMensures').innerHTML = tableauMesures(mesures);
  }

  async function supprimerPesee(id) {
    if (!confirm('Supprimer cette pesée ?')) return;
    const { error } = await sb.from('pesees').delete().eq('id', id);
    if (error) {
      alert('Erreur : ' + error.message);
    } else {
      charger();
    }
  }

  async function supprimerMesure(id) {
    if (!confirm('Supprimer ces mesures ?')) return;
    const { error } = await sb.from(TABLE_MESURES).delete().eq('id', id);
    if (error) {
      alert('Erreur : ' + error.message);
    } else {
      charger();
    }
  }

  // ---------- Saisie des pesées ----------
  document.getElementById('formPesee').addEventListener('submit', async e => {
    e.preventDefault();
    const message = document.getElementById('messagePesee');
    message.textContent = 'Enregistrement…';

    const { error } = await sb.from('pesees').upsert({
      user_id: userId,
      date: document.getElementById('datePesee').value,
      poids: parseFloat(document.getElementById('poids').value),
      note: document.getElementById('note').value.trim() || null
    }, { onConflict: 'user_id,date' });

    if (error) {
      message.textContent = 'Erreur : ' + error.message;
    } else {
      message.textContent = 'Pesée enregistrée.';
      document.getElementById('poids').value = '';
      document.getElementById('note').value = '';
      charger();
    }
  });

  // ---------- Saisie des mesures corporelles ----------
  document.getElementById('formMensure').addEventListener('submit', async e => {
    e.preventDefault();
    const message = document.getElementById('messageMensure');
    message.textContent = 'Enregistrement…';

    const ligne = {
      user_id: userId,
      date: document.getElementById('dateMensure').value
    };
    MESURES.forEach(c => {
      const valeur = document.getElementById('m_' + c).value;
      ligne[c] = valeur === '' ? null : parseFloat(valeur);
    });

    const { error } = await sb.from(TABLE_MESURES).upsert(ligne, { onConflict: 'user_id,date' });

    if (error) {
      message.textContent = 'Erreur : ' + error.message;
    } else {
      message.textContent = 'Mesures enregistrées.';
      MESURES.forEach(c => { document.getElementById('m_' + c).value = ''; });
      charger();
    }
  });

  // ---------- Graphique ----------
  function dansPeriode(dateStr) {
    const p = document.getElementById('periode').value;
    if (p === 'tout') return true;
    const jours = { '5j': 5, '1m': 30, '6m': 182, '1a': 365 }[p];
    const limite = new Date();
    limite.setHours(0, 0, 0, 0);
    limite.setDate(limite.getDate() - jours);
    return dateLocale(dateStr) >= limite;
  }

  function optionsGraphique() {
    return {
      backgroundColor: 'transparent',
      legend: 'none',
      colors: ['#6c8cff'],
      lineWidth: 2,
      pointSize: 5,
      titleTextStyle: { color: '#9aa0b4' },
      hAxis: { format: 'dd/MM', textStyle: { color: '#9aa0b4' }, gridlines: { color: '#2a2f3d' } },
      vAxis: { textStyle: { color: '#9aa0b4' }, gridlines: { color: '#2a2f3d' }, baselineColor: '#2a2f3d' },
      chartArea: { width: '85%', height: '75%' }
    };
  }

  function dessiner() {
    if (!googleChargé) return;

    const type = document.getElementById('type').value;
    const table = new google.visualization.DataTable();
    const options = optionsGraphique();
    let lignes = [];
    let resume = '';

    if (type === 'poids') {
      const triees = pesees
        .filter(p => dansPeriode(p.date))
        .slice()
        .sort((a, b) => a.date.localeCompare(b.date));
      lignes = triees.map(p => [dateLocale(p.date), Number(p.poids), infoBulle(p)]);
      table.addColumn('date', 'Date');
      table.addColumn('number', 'Poids (kg)');
      table.addColumn({ type: 'string', role: 'tooltip' });
      options.vAxis.title = 'kg';
      if (triees.length) {
        const premier = Number(triees[0].poids);
        const dernier = Number(triees[triees.length - 1].poids);
        const diff = dernier - premier;
        resume = 'Départ : ' + fr(premier) + ' kg · Actuel : ' + fr(dernier) + ' kg · Variation : '
          + (diff > 0 ? '+' : '') + fr(diff) + ' kg';
      }
    }

    if (type === 'semaine') {
      const groupes = {};
      pesees.filter(p => dansPeriode(p.date)).forEach(p => {
        const cle = versIso(lundiDe(dateLocale(p.date)));
        (groupes[cle] = groupes[cle] || []).push(Number(p.poids));
      });
      lignes = Object.keys(groupes).sort().map(cle => {
        const vals = groupes[cle];
        return [dateLocale(cle), vals.reduce((a, b) => a + b, 0) / vals.length];
      });
      table.addColumn('date', 'Semaine du');
      table.addColumn('number', 'Poids moyen (kg)');
      options.vAxis.title = 'kg';
    }

    if (!lignes.length) {
      document.getElementById('graph').textContent = 'Pas de données sur cette période.';
      document.getElementById('graph').style.color = '#9aa0b4';
      document.getElementById('resume').textContent = '';
      return;
    }

    document.getElementById('graph').textContent = '';
    table.addRows(lignes);
    const chart = new google.visualization.LineChart(document.getElementById('graph'));
    chart.draw(table, options);
    document.getElementById('resume').textContent = resume;
  }

  document.getElementById('type').addEventListener('change', dessiner);
  document.getElementById('periode').addEventListener('change', dessiner);

  demarrer();
</script>
</body>
</html>
